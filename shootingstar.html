<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Swoosh</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/favicon-32x32.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/satoshi">
</head>
<body>

    <header class="header">
      <div class="logotext">
        <img src="images/bac_logo_small.svg" alt="Baccarat E-Sports Logo">
        <h1 id="bac">BAC E-Sports</h1>
      </div>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="maps.html">Maps</a></li>
            <li><a href="brawlers.html">Brawlers</a></li>
          </ul>
        </nav>
    </header>



    <main class="maindraft">
      <section class="pkimg">
        <h2 class="drafttitle">Canal Grande</h2>
        <img src="images/maps/bounty/ShootingStar.webp" alt="Double Swoosh">
      </section>
      <section class="picks">
        <div class="pkmain">
          <div class="pk1st">
            <h3>1st Pick</h3>
            <div class="img1st">
              <img src="images/brawlers/ANGELO.webp" alt="Angelo">
              <img src="images/brawlers/JUJU.webp" alt="Juju">
              <img src="images/brawlers/TICK.webp" alt="Tick">
              <img src="images/brawlers/GENE.webp" alt="Gene">
              <img src="images/brawlers/Gus.webp" alt="Gus">
              <img src="images/brawlers/PIPER.webp" alt="Piper">
            </div>
          </div>
          <div class="bwmain">
            <h4>Best</h4>
            <img src="images/bac_logo.svg" alt="BAC Logo" class="bwlogo">
            <h4>Worst</h4>
          </div>
          <div class="pk6th">
            <h3>6th Pick</h3>
            <div class="img6th">
              <img src="images/brawlers/DARRYL.webp" alt="Darryl">
              <img src="images/brawlers/SQUEAK.webp" alt="Squeak">
              <img src="images/brawlers/MORTIS.webp" alt="Mortis">
              <img src="images/brawlers/SPROUT.webp" alt="Sprout">
              <img src="images/brawlers/GROM.webp" alt="Grom">
              <img src="images/brawlers/8-BIT.webp" alt="8-Bit">
            </div>
          </div>
        </div>
        <div class="pkother">
          <h3>Other Picks</h3>
          <div class="imgother">
            <img src="images/brawlers/R-T.webp" alt="R-T">
            <img src="images/brawlers/BYRON.webp" alt="Byron">
            <img src="images/brawlers/NANI.webp" alt="Nani">
            <img src="images/brawlers/LARRY & LAWRIE.webp" alt="Larrie & Lawrie">
            <img src="images/brawlers/CARL.webp" alt="Carl">
            <img src="images/brawlers/EVE.webp" alt="Eve">
            <img src="images/brawlers/Kenji.webp" alt="Kenji">
            <img src="images/brawlers/BO.webp" alt="Bo">
            <img src="images/brawlers/LOLA.webp" alt="Lola  ">
            <img src="images/brawlers/BELLE.webp" alt="Belle">
            <img src="images/brawlers/MANDY.webp" alt="Mandy">
            <img src="images/brawlers/PEARL.webp" alt="PEARL">
            <img src="images/brawlers/MAX.webp" alt="Max">
            <img src="images/brawlers/GRAY.webp" alt="Gray">
            <img src="images/brawlers/MELODIE.webp" alt="MELODIE">
            <img src="images/brawlers/LEON.webp" alt="Leon">
            <img src="images/brawlers/PENNY.webp" alt="Penny">
            <img src="images/brawlers/BROCK.webp" alt="Brock">
          </div>
          <div class="bwother">
            <h4>Best</h4>
            <h4>Worst</h4>
          </div>
        </div>
      </section>
      </main>

    <footer>
        <a href="https://discord.gg/tgXgBX7B3z" target="_blank" class="discord">Join our Discord</a>
        <p>&copy; BAC E-Sports</p>

    </footer>

    <script src="script.js"></script>
</body>
</html>
